name: Standard CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  SKIP_ENV_VALIDATION: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  python-root:
    name: Python (.)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: 3.12
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[all]
          pip install -r tests/requirements.txt
          pip install pytest ruff pip-audit
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (non-browser)
        run: python -m pytest tests -q -m 'not browser' || [ $? -eq 5 ]
      - name: Dependency audit (report only)
        continue-on-error: true
        run: pip-audit
